name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Only in the public repository (the private development repository has no use for it).
    if: github.repository == 'Dalailalama/embeddinggemma2-rust'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # The CUDA backend needs no CUDA SDK to build (its libraries are loaded at run time).
      - run: cargo build --release --locked
      # Unit tests; the parity tests skip themselves without the model weights.
      - run: cargo test --release --locked
