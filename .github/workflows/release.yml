name: Release

# Push a tag like v0.3.1 to build the binaries and the Python wheels, publish a GitHub release, mirror it to
# Hugging Face and upload the wheels to PyPI. Run it by hand (workflow_dispatch) to build and smoke-test the wheels
# without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'Dalailalama/embeddinggemma2-rust' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: windows-latest
            archive: egemma2-${{ github.ref_name }}-windows-x64.zip
          - os: ubuntu-latest
            archive: egemma2-${{ github.ref_name }}-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/egemma2.exe, README.md, LICENSE, NOTICE dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp target/release/egemma2 README.md LICENSE NOTICE dist/
          tar -czf "${{ matrix.archive }}" -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Re-runs replace the assets of an existing release instead of failing.
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "egemma2 ${{ github.ref_name }}" --generate-notes
          fi
      - name: Mirror to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::warning::HF_TOKEN secret not set: skipping the Hugging Face upload"; exit 0; fi
          python -m pip install --quiet --upgrade huggingface_hub
          hf upload DawgOG/embeddinggemma2-rust dist "releases/${{ github.ref_name }}" --commit-message "egemma2 ${{ github.ref_name }}"

  # The Python package: the egemma2 binary plus the client in python/egemma2 (see pyproject.toml).
  wheels:
    if: github.repository == 'Dalailalama/embeddinggemma2-rust'
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
            manylinux: "2_28"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          args: --release --locked --out dist
          manylinux: ${{ matrix.manylinux }}
      - name: Smoke-test the wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          egemma2 --version
          python -m egemma2 --version
          python -c "import egemma2, os; p = egemma2.find_egemma2_bin(); assert os.path.isfile(p), p; print(egemma2.__version__, p)"
          # The reference-data cases skip themselves here (no model weights in CI).
          python -m unittest discover -s python/tests -v
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ runner.os }}
          path: dist/*.whl

  sdist:
    if: github.repository == 'Dalailalama/embeddinggemma2-rust'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # Trusted publishing: PyPI must list this repository, this workflow (release.yml) and the environment `pypi` as a
  # publisher of `egemma2`. Until it does, this job fails and the rest of the release is unaffected; re-run it after.
  pypi:
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
