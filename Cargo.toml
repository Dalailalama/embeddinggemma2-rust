[package]
name = "embeddinggemma2"
version = "0.3.2"
edition = "2024"
description = "Open-source Rust port of Google's EmbeddingGemma 2: text, image, audio and video embeddings on CPU or CUDA"
license = "Apache-2.0"
repository = "https://github.com/Dalailalama/embeddinggemma2-rust"
readme = "README.md"
# Reference data (92 MB), the Hugging Face card and promotion drafts stay out of the crate and the Python sdist.
exclude = ["testdata/", "hf/", "linkedin/", "promo/", ".github/"]
keywords = ["embeddings", "gemma", "cuda", "multimodal", "semantic-search"]
categories = ["science", "multimedia"]

[features]
default = ["cuda"]
# CUDA backend (cuBLAS + NVRTC kernels). Libraries are loaded at runtime, so building with this
# feature needs no CUDA SDK; without a GPU the model simply runs on the CPU.
cuda = ["dep:cudarc"]

[dependencies]
cudarc = { version = "0.19.10", optional = true, default-features = false, features = ["std", "cublas", "driver", "nvrtc", "dynamic-loading", "cuda-13020"] }
anyhow = "1.0.104"
base64 = "0.13.1"
clap = { version = "4.6.7", features = ["derive"] }
gemm = "0.19.0"
half = "2.7.1"
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
memmap2 = "0.9.11"
rayon = "1.12.0"
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tiny_http = "0.12.0"
tokenizers = "0.23.2"

[[bin]]
name = "egemma2"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 3
